{% extends "base.html" %}
{% block auth_content %}
<div class="min-h-screen bg-navy-900 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 space-y-6">
        <div class="text-center">
            <div class="w-12 h-12 rounded-xl bg-royal-600 text-white font-bold text-xl flex items-center justify-center mx-auto mb-3 shadow-lg">SF</div>
            <h1 class="text-2xl font-bold text-navy-900">FacultySync Portal</h1>
            <p class="text-sm text-slate-500 mt-1">Smart Faculty Availability & Consultation System</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-royal-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-royal-500 outline-none">
            </div>
            <button type="submit" class="w-full py-2.5 rounded-lg bg-royal-600 hover:bg-royal-500 text-white font-semibold shadow transition">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-slate-600">
            New Student? <a href="{% url 'register' %}" class="text-royal-600 font-semibold hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
